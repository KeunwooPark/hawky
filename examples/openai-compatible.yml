# Any OpenAI-compatible endpoint: Azure OpenAI, OpenRouter, Together, Groq,
# Fireworks, vLLM, llama.cpp, Ollama. Only base-url and model change.
name: Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: KeunwooPark/hawky@v1
        with:
          provider: openai
          base-url: https://openrouter.ai/api/v1
          model: qwen/qwen3-coder
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Reasoning models spend the output budget thinking before they answer,
          # which truncates the review no matter how small the batch is. Turn it
          # down unless you have raised max-response-tokens to pay for both.
          # Not "none": reviewing a diff is what the thinking is for, and a model
          # told not to think finds nothing, fast.
          reasoning: minimal
