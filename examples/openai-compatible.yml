# Any OpenAI-compatible endpoint: Azure OpenAI, OpenRouter, Together, Groq,
# Fireworks, vLLM, llama.cpp, Ollama. Only base-url and model change.
name: Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: keunwoo/hawky@v1
        with:
          provider: openai
          base-url: https://openrouter.ai/api/v1
          model: qwen/qwen3-coder
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
