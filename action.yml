name: 'Hawky — LLM Pull Request Review'
description: 'Reviews pull requests with an LLM and opens refactoring issues. Works with Anthropic and any OpenAI-compatible API.'
author: 'keunwoo'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  api-key:
    description: 'API key for the LLM provider. Store it in a repository secret.'
    required: true
  provider:
    description: 'LLM provider: "anthropic" or "openai". "openai" covers any OpenAI-compatible endpoint (Azure, OpenRouter, Together, Groq, vLLM, Ollama) via base-url. Default: anthropic.'
    required: false
    default: ''
  model:
    description: 'Model id. Default: claude-opus-5 (anthropic) or gpt-4.1 (openai).'
    required: false
    default: ''
  base-url:
    description: 'Override the API base URL. Required for OpenAI-compatible providers other than OpenAI itself.'
    required: false
    default: ''
  reasoning:
    description: 'How much the model should think before answering: minimal | low | medium | high. Default: the endpoint default. Reasoning tokens are billed against the same output cap as the answer, so turn this down if replies are being truncated. Not every endpoint implements "minimal" — GLM starts at "low" — and a refused value steps to the nearest level that endpoint does accept. "none" is still accepted for compatibility but is not recommended for code review: it can end a review in seconds having found nothing, which a merge gate cannot tell from a clean diff.'
    required: false
    default: ''
  max-response-tokens:
    description: 'Starting output budget for one LLM call, reasoning included. Doubles automatically (up to 3 times) when a reply is truncated. Default: 16000.'
    required: false
    default: ''
  request-timeout:
    description: 'Seconds to wait for one LLM call before giving up on it. Default: derived from max-response-tokens, so raising the budget also moves the deadline it has to be delivered inside. Set this only if your endpoint is slower than that derivation assumes; a request that times out is not retried unchanged.'
    required: false
    default: ''
  mode:
    description: 'What to do: "review" (inline PR feedback), "refactor" (open refactoring issues), or "both". Default: review.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the diff and write comments/issues.'
    required: false
    default: ${{ github.token }}
  config-path:
    description: 'Path to the YAML config file. Default: .github/hawky.yml'
    required: false
    default: '.github/hawky.yml'
  max-comments:
    description: 'Maximum inline comments to post in one run. Default: 15.'
    required: false
    default: ''
  min-severity:
    description: 'Drop findings below this severity: low | medium | high | critical. Default: medium.'
    required: false
    default: ''
  min-confidence:
    description: 'Drop findings below this model-reported confidence, 0-1. Default: 0.6.'
    required: false
    default: ''
  exclude:
    description: 'Newline- or comma-separated globs to skip, in addition to the built-in defaults.'
    required: false
    default: ''
  include:
    description: 'Newline- or comma-separated globs to restrict review to. Empty means all files.'
    required: false
    default: ''
  guidelines:
    description: 'Project-specific review guidelines injected into the prompt.'
    required: false
    default: ''
  fail-on-severity:
    description: 'Fail the check if a finding at or above this severity is found: low | medium | high | critical | none. Default: none. Set this to block pull requests via a required status check.'
    required: false
    default: ''
  fail-on-incomplete:
    description: 'Fail the check if part of the diff could not be reviewed (an LLM call errored out). Recommended when using fail-on-severity as a merge gate. Default: false.'
    required: false
    default: ''
  dismissals:
    description: 'How a reviewer may waive a false positive so it stops blocking the merge: "all" (an `@hawky ignore` reply, or resolving the review thread), "command" (the reply only), or "off" (nothing waives a finding). Default: all.'
    required: false
    default: ''
  codebase-context:
    description: 'Search the checked-out repository for definitions this change re-implements and show them to the reviewer, so the reuse check has evidence rather than a guess. Requires actions/checkout in the job; with no checkout the scan is skipped with one warning and the diff is reviewed exactly as before. Default: true.'
    required: false
    default: ''
  bug-report-footer:
    description: 'End the summary comment with a collapsed "Is Hawky itself broken?" section that tells people and coding agents how to report a bug in Hawky to its public issue tracker, without copying anything from this repository. Default: true.'
    required: false
    default: ''
  max-issues:
    description: 'Maximum refactoring issues to open in one run. Default: 3.'
    required: false
    default: ''
  issue-labels:
    description: 'Comma-separated labels applied to refactoring issues. Default: hawky,refactor.'
    required: false
    default: ''
  dry-run:
    description: 'Compute everything and log it, but do not post comments or open issues.'
    required: false
    default: 'false'

outputs:
  review-passed:
    description: '"true" when nothing crossed the fail-on-severity threshold, "false" otherwise. Set even when the run fails, so a later step can read it with `if: always()`.'
  highest-severity:
    description: 'Highest severity found on this run: low | medium | high | critical | none.'
  findings-count:
    description: 'Number of inline findings posted.'
  dismissed-count:
    description: 'Number of findings a reviewer waived on this run. These are reported but excluded from the gate.'
  issues-created:
    description: 'Number of refactoring issues opened.'
  summary:
    description: 'The review summary text.'

runs:
  using: 'node24'
  main: 'dist/index.js'
